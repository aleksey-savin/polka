# VPS: контейнер за Nginx Proxy Manager.
# NPM проксирует поддомен → polka:3000 (общая docker-сеть) или host:3000 (ports ниже).
# Деплой pull-моделью: watchtower раз в минуту проверяет GHCR и сам
# перекатывает polka на свежий образ (пакет ghcr.io должен быть публичным).
services:
  polka:
    image: ghcr.io/aleksey-savin/polka:latest
    container_name: polka
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?задайте в .env}
      APP_URL: ${APP_URL:?задайте в .env, например https://polka.example.ru}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      # debug добавляет статику и каждую серверную функцию
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - polka-data:/data
    # журнал приложения живёт в /data/logs; здесь — страховка от разрастания
    # логов самого docker (их всё равно уносит пересоздание контейнера)
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'bun', '-e', "await fetch('http://127.0.0.1:3000/login')"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  watchtower:
    image: containrrr/watchtower
    container_name: polka-watchtower
    restart: unless-stopped
    environment:
      # watchtower собран со старым docker-клиентом (API 1.25); новые демоны
      # требуют ≥1.40 — форсируем версию API, иначе рестарт-луп.
      DOCKER_API_VERSION: '1.44'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup polka

volumes:
  polka-data:
